name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - nightly
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # OpenAPI 1 requires Julia 1.11; 1.10 still runs every Servo-owned test.
      - name: Run Julia 1.10 tests
        if: matrix.version == '1.10'
        shell: julia --startup-file=no --color=yes --code-coverage=user {0}
        run: |
          import Pkg
          mktempdir() do env
              Pkg.activate(env)
              Pkg.develop(path=pwd())
              Pkg.add(["HTTP", "JSON", "Test"])
              ENV["SERVO_TEST_OPENAPI"] = "false"
              include(joinpath(pwd(), "test", "runtests.jl"))
          end
      - uses: julia-actions/julia-runtest@v1
        if: matrix.version != '1.10'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
